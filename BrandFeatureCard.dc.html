<style>

.bfc-soon { cursor:default; }

<a href="{{ href }}" onClick="{{ onNav }}" class="bfc{{ soonCls }}">

      </sc-if>

    <span class="t-caption" style="{{ labelStyle }}">{{ placeholderLabel }}</span>
    <div class="bfc-shade" aria-hidden="true"></div>
    <sc-if value="{{ soon }}" hint-placeholder-val="{{ false }}"><span class="bfc-chip">Coming soon</span></sc-if>

      <p class="bfc-desc">{{ desc }}</p>
      <div class="bfc-tags">
        <sc-for list="{{ tagList }}" as="t" hint-placeholder-count="3"><span class="bfc-pill">{{ t.label }}</span></sc-for>
      </div>
    </div>
  </div>
</a>
